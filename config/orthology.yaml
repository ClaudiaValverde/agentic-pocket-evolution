# Orthology (O2) configuration. Read by scripts/orthology/*.py. Paths: bulk under /tmp/pe_big (home quota).
snapshot_manifest: data/snapshot/20261030T085136Z/manifest.parquet
atlas_root: /cluster/scratch/gmagnusson/pocketcompare_afdb
work_dir: /tmp/pe_big/ancestra/o2              # bulk, regenerable
taxdump_dir: /tmp/pe_big/ancestra/taxdump      # NCBI taxdump (nodes.dmp, names.dmp, merged.dmp)
tier1_proteomes: data/orthology/ancestra_tier1_v0/ref_proteomes.tsv
tier1_fasta_dir: /tmp/pe_big/ancestra/tier1_fa
uniprot_refprot_base: https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/reference_proteomes
out_dir: data/orthology/ancestra_O2            # compact outputs kept in the repo

context:
  max_total_proteins: 1550000   # tier 1 + context (keeps O2 <~1.5 h)
  min_proteins: 1000            # canonical (one-protein-per-gene) proteome size
  max_proteins: 45000
  exclude_placeholder_names: true   # "X bacterium", "uncultured X", "X sp." (MAG-like)
  # (a) eukaryotic densification slots, chosen REGARDLESS of atlas coverage (pockets computed locally from the
  #     Foldcomp v4 DB when atlas overlap < min_atlas_overlap). Slots are filled in this order.
  #     Inside a slot: <=1 per order and per genus; priority = has UniProt mnemonic, #isoforms (annotation depth).
  max_proteins_slot: 32000     # avoid polyploid / huge gene sets in (a) (salmonids, wheat relatives)
  min_fc_coverage: 0.8          # required: fraction of proteome accessions in fc_entries_afdb_uniprot_v4 or atlas
  eukaryote_slots:
    - {name: Primates,        taxid: 9443,    n: 1}
    - {name: Laurasiatheria,  taxid: 314145,  n: 1}
    - {name: Metatheria,      taxid: 9263,    n: 1}
    - {name: Aves,            taxid: 8782,    n: 1}
    - {name: Lepidosauria,    taxid: 8504,    n: 1}
    - {name: Amphibia,        taxid: 8292,    n: 1}
    - {name: Actinopterygii,  taxid: 7898,    n: 1}
    - {name: Chondrichthyes,  taxid: 7777,    n: 1}
    - {name: Cyclostomata,    taxid: 1476529, n: 1}
    - {name: Insecta,         taxid: 50557,   n: 4}
    - {name: Arachnida,       taxid: 6854,    n: 1}
    - {name: Nematoda,        taxid: 6231,    n: 3}
    - {name: Platyhelminthes, taxid: 6157,    n: 1}
    - {name: Mollusca,        taxid: 6447,    n: 1}
    - {name: Echinodermata,   taxid: 7586,    n: 1}
    - {name: Cnidaria,        taxid: 6073,    n: 1}
    - {name: Choanoflagellata, taxid: 28009,  n: 1}
    - {name: Embryophyta,     taxid: 3193,    n: 5}
    - {name: Chlorophyta,     taxid: 3041,    n: 1}
    - {name: Saccharomycotina, taxid: 147537, n: 2}
    - {name: Pezizomycotina,  taxid: 147538,  n: 3}
    - {name: Basidiomycota,   taxid: 5204,    n: 2}
    - {name: Mucoromycota,    taxid: 1913637, n: 1}
    - {name: Kinetoplastea,   taxid: 5653,    n: 1}
    - {name: Apicomplexa,     taxid: 5794,    n: 1}
    - {name: Stramenopiles,   taxid: 33634,   n: 2}
    - {name: Amoebozoa,       taxid: 554915,  n: 1}
  # (b) atlas-complete taxa (>= min_atlas_overlap of proteome accessions already in the snapshot): prokaryotes and
  #     protists, round-robin over phyla, densify-around-tier-1 priority, capped per class/genus and by protein budget.
  min_size_ratio: 0.9         # prefilter: atlas accessions of the taxid / proteome size
  min_atlas_overlap: 0.9
  atlas_max_total: 100
  atlas_groups:               # a taxon belongs to the first matching group; groups filled round-robin
    - {name: protists, taxid: 2759, exclude: [4751, 33090, 33208], quota: 8}
    - {name: bacteria, taxid: 2,    quota: 60}
    - {name: archaea,  taxid: 2157, quota: 30}
  max_per_class: 6
  max_per_genus: 1

ancestra:
  threads: 40
  preset: accurate            # fall back to fast if the accurate estimate exceeds max_wall_h
  max_wall_h: 2.5

idgap:
  min_identity: 95.0          # DIAMOND identity (%) for sequence-based mapping
  min_cov: 0.8                # query and subject coverage

placement:
  evalue: 1.0e-10
  min_query_cov: 50.0
  min_subject_cov: 0.0
  diamond_mode: --fast
  chunk_size: 500000          # query sequences per chunk (tier-3 streaming)
  threads: 40
